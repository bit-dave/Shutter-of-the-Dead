SHUTTER OF THE DEAD — camera AR prototype (single file)
HOW TO HOST (must be https — iPhone blocks camera + motion sensors otherwise):

  Or GitHub Pages: new repo -> upload index.html -> Settings > Pages > Deploy from branch (main) -> open https://<you>.github.io/<repo>/

PLAY: Tap START, allow Camera + Motion. Stand in place, hold phone upright.
  SETUP: aim at a door/window, tap MARK BREACH (up to 4). Tap BEGIN.

  <h1>SHUTTER<br>OF THE DEAD</h1>

<script type="module">
import * as THREE from "three";
const $=id=>document.getElementById(id);
const MAG=8, MAX_HP=5, FLOOR=-1.4, BREACH_DIST=3.5;
const S={mode:"title",hp:MAX_HP,ammo:MAG,reloading:false,score:0,combo:0,comboT:0,wave:0,toSpawn:0,spawnT:0,gyro:false,breaches:[],boss:false};

// ---------- renderer ----------
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0,0);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.05,60);camera.rotation.order="YXZ";
scene.add(new THREE.HemisphereLight(0xbbbbcc,0x332211,1.4));
const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(2,5,3);scene.add(dl);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// ---------- orientation (3DoF) ----------
const ori={a:0,b:0,g:0,ok:false}; let yawOff=0; let mouseYaw=0,mousePitch=0;
const zee=new THREE.Vector3(0,0,1),euler=new THREE.Euler(),q0=new THREE.Quaternion(),q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)),qOff=new THREE.Quaternion();
function onOri(e){if(e.alpha==null)return;ori.a=e.alpha;ori.b=e.beta;ori.g=e.gamma;if(!ori.ok){ori.ok=true;S.gyro=true;setTimeout(recenter,50)}}
function screenAngle(){return (screen.orientation&&screen.orientation.angle)||window.orientation||0}
function deviceQuat(out){const d=THREE.MathUtils.DEG2RAD;euler.set(ori.b*d,ori.a*d,-ori.g*d,"YXZ");out.setFromEuler(euler);out.multiply(q1);out.multiply(q0.setFromAxisAngle(zee,-screenAngle()*d));return out}
const tmpQ=new THREE.Quaternion(),tmpE=new THREE.Euler(0,0,0,"YXZ");
function recenter(){if(!ori.ok){mouseYaw=0;return}deviceQuat(tmpQ);tmpE.setFromQuaternion(tmpQ,"YXZ");yawOff=tmpE.y}
function updateCam(){if(ori.ok){deviceQuat(tmpQ);qOff.setFromAxisAngle(new THREE.Vector3(0,1,0),-yawOff);camera.quaternion.copy(qOff).multiply(tmpQ)}else{camera.rotation.set(mousePitch,mouseYaw,0)}}

// ---------- audio ----------
let AC;function snd(f,d,type="square",v=.2,slide=0){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function noise(d,v=.3){if(!AC)return;const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=v;s.buffer=b;s.connect(g).connect(AC.destination);s.start()}

// ---------- start ----------
$("start").onclick=async()=>{
  AC=new (window.AudioContext||window.webkitAudioContext)();
  let st=[];
  try{if(typeof DeviceOrientationEvent!=="undefined"&&DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission();if(r!=="granted")st.push("motion denied")}
    addEventListener("deviceorientation",onOri,true)}catch(e){st.push("motion unavailable")}
  try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});const v=$("cam");v.srcObject=s;await v.play()}catch(e){st.push("no camera")}
  $("status").textContent=st.join(", ");
  $("overlay").style.display="none";$("hud").style.display="block";
  startSetup();
};
function startSetup(){S.mode="setup";S.hp=MAX_HP;S.score=0;S.combo=0;S.wave=0;S.ammo=MAG;
  for(const z of zombies.slice())killZ(z,true);for(const b of S.breaches)scene.remove(b.mesh);S.breaches=[];
  $("mark").style.display=$("begin").style.display="block";$("reload").style.display="none";
  flashMsg(ori.ok||!isTouch()?"Aim at doors/windows<br>tap MARK BREACH, then BEGIN":"Aim with drag. Mark breaches, then BEGIN",4000);hud()}
const isTouch=()=>"ontouchstart"in window;
$("mark").onclick=e=>{e.stopPropagation();if(S.breaches.length>=4)return flashMsg("Max 4 breaches");
  const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);dir.y=Math.max(-.3,Math.min(.4,dir.y));dir.normalize();
  const p=dir.multiplyScalar(BREACH_DIST);if(p.y<FLOOR+0.9)p.y=FLOOR+0.9;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1.8),new THREE.MeshBasicMaterial({color:0xff6600,transparent:true,opacity:.25,side:2,depthWrite:false}));
  m.position.copy(p);m.lookAt(0,p.y,0);scene.add(m);S.breaches.push({pos:p.clone(),mesh:m,hp:0});snd(600,.1,"triangle");
  flashMsg("Breach "+S.breaches.length+" marked")};
$("begin").onclick=e=>{e.stopPropagation();$("mark").style.display=$("begin").style.display="none";$("reload").style.display="block";
  for(const b of S.breaches)b.mesh.material.opacity=.08;S.mode="play";nextWave()};
$("recal").onclick=e=>{e.stopPropagation();recenter()};
$("reload").onclick=e=>{e.stopPropagation();reload()};
["mark","begin","recal","reload"].forEach(id=>$(id).addEventListener("pointerdown",e=>e.stopPropagation()));

// ---------- input: tap shoot, two-finger reload (fixed: count active pointers / touches) ----------
const pointers=new Set();let drag=null;
addEventListener("pointerdown",e=>{if(S.mode==="title")return;pointers.add(e.pointerId);
  if(pointers.size>=2){reload();return}
  drag={x:e.clientX,y:e.clientY,moved:0}});
addEventListener("pointermove",e=>{if(!drag||ori.ok)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved+=Math.abs(dx)+Math.abs(dy);drag.x=e.clientX;drag.y=e.clientY;
  mouseYaw-=dx*.005;mousePitch=Math.max(-1.3,Math.min(1.3,mousePitch-dy*.005))});
addEventListener("pointerup",e=>{const n=pointers.size;pointers.delete(e.pointerId);if(drag&&n===1&&(ori.ok||drag.moved<12)&&S.mode==="play")shoot();drag=null});
addEventListener("pointercancel",e=>{pointers.delete(e.pointerId);drag=null});
addEventListener("touchstart",e=>{if(e.touches.length>=2)reload()},{passive:true});
addEventListener("keydown",e=>{if(e.key==="r"||e.key==="R")reload()});

// ---------- FX ----------
const parts=[];const pGeo=new THREE.BoxGeometry(.05,.05,.05);
function burst(pos,color,n=12,spd=2,up=1){for(let i=0;i<n;i++){const m=new THREE.Mesh(pGeo,new THREE.MeshLambertMaterial({color}));m.position.copy(pos);
  m.userData={v:new THREE.Vector3((Math.random()-.5)*spd,Math.random()*spd*up,(Math.random()-.5)*spd),life:.8+Math.random()*.5};scene.add(m);parts.push(m)}}
function crackTex(kind){const c=document.createElement("canvas");c.width=c.height=128;const g=c.getContext("2d");
  if(kind==="dirt"){const gr=g.createRadialGradient(64,64,5,64,64,62);gr.addColorStop(0,"#1a0f06");gr.addColorStop(.6,"#3b2513cc");gr.addColorStop(1,"#3b251300");g.fillStyle=gr;g.fillRect(0,0,128,128)}
  g.strokeStyle=kind==="dirt"?"#0a0603":"#fff";g.lineWidth=3;for(let i=0;i<9;i++){g.beginPath();g.moveTo(64,64);let x=64,y=64,a=Math.random()*6.28;for(let k=0;k<5;k++){a+=(Math.random()-.5);x+=Math.cos(a)*12;y+=Math.sin(a)*12;g.lineTo(x,y)}g.stroke()}
  return new THREE.CanvasTexture(c)}
const dirtTex=crackTex("dirt"),glassTex=crackTex("glass");
function tracer(){const f=$("dmg");}
function flashMsg(t,ms=1600){const m=$("msg");m.innerHTML=t;m.style.opacity=1;clearTimeout(m._t);m._t=setTimeout(()=>m.style.opacity=0,ms)}

// ---------- zombies ----------
const zombies=[];
// ---- Zed Head zombie (procedural, shared geo/mats) ----
const ZG={};const ZM={};
function zTex(){const c=document.createElement("canvas");c.width=c.height=128;const g=c.getContext("2d");g.fillStyle="#f4eee0";g.fillRect(0,0,128,128);
  g.strokeStyle="#c0101a";g.lineWidth=1.5;for(let i=0;i<14;i++){g.beginPath();let x=Math.random()*128,y=Math.random()*128;g.moveTo(x,y);for(let k=0;k<5;k++){x+=(Math.random()-.5)*24;y+=(Math.random()-.5)*24;g.lineTo(x,y)}g.stroke()}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
function zedMats(boss){const k=boss?"b":"n";if(ZM[k])return ZM[k];const em=boss?0x1f6a10:0x000000,ei=boss?.55:0;
  const S=(c,r=.55,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r,metalness:.05,emissive:em,emissiveIntensity:ei},o));
  return ZM[k]={skin:S(boss?0x8fa548:0x8f915a,.5),bone:S(boss?0x9fb258:0xa3a06a,.45),pants:S(boss?0x5d6a2c:0x6b6640,.75),shoe:S(boss?0x3e4a1c:0x4a4630,.6),
    dark:S(0x120d0a,.9,{emissive:0,emissiveIntensity:0}),white:S(0xf4f0e2,.3,{emissive:0,emissiveIntensity:0}),hair:S(0x1b1610,.8,{emissive:0,emissiveIntensity:0}),
    tongue:S(0xa04a4a,.4,{emissive:0,emissiveIntensity:0}),cord:S(0xb0101a,.4,{emissive:0,emissiveIntensity:0}),veins:S(0xffffff,.3,{map:zTex(),emissive:0,emissiveIntensity:0}),
    hit:new THREE.MeshBasicMaterial({visible:false})}}
function zedGeo(){if(ZG.ok)return ZG;const V=(x,y)=>new THREE.Vector2(x,y);
  ZG.skull=new THREE.LatheGeometry([V(0,-.13),V(.06,-.13),V(.085,-.08),V(.1,-.02),V(.135,.06),V(.15,.13),V(.13,.2),V(.08,.24),V(0,.25)],16);
  ZG.sph=new THREE.SphereGeometry(1,14,10);ZG.cyl=new THREE.CylinderGeometry(1,1,1,8);ZG.cap=new THREE.CapsuleGeometry(1,1,4,8);
  ZG.pant=new THREE.CylinderGeometry(.075,.12,.6,10,1,true);ZG.rib=new THREE.TorusGeometry(1,.14,6,18,Math.PI*1.35);
  ZG.cord=new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(0,0,0),new THREE.Vector3(.02,-.06,.04),new THREE.Vector3(-.01,-.14,.05),new THREE.Vector3(0,-.2,.04)]),12,.007,5);
  ZG.hair=[];for(let i=0;i<7;i++){const a=(i/6-.5)*2.2,pts=[];for(let k=0;k<6;k++){const t=k/5;pts.push(new THREE.Vector3(Math.sin(a)*(.1+t*.06)+Math.sin(t*9+i)*.02,.2+Math.sin(t*3.1)*.06-t*.12*Math.abs(a),Math.cos(a)*-.04-t*.05+Math.cos(t*8+i)*.02))}
    ZG.hair.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),10,.011,4))}
  ZG.hitBody=new THREE.CapsuleGeometry(.24,.95,2,6);ZG.hitHead=new THREE.SphereGeometry(.19,8,6);ZG.ok=1;return ZG}
function buildZed(boss=false){const G=zedGeo(),M=zedMats(boss),root=new THREE.Group();root.name="ZedZombie";
  const P=(geo,mat,x,y,z,sx=1,sy=sx,sz=sx,par=root,name)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);if(name)m.name=name;par.add(m);return m};
  const piv=(x,y,z,par=root,name)=>{const g=new THREE.Group();g.position.set(x,y,z);if(name)g.name=name;par.add(g);return g};
  // legs + shoes
  const legs=[];for(const s of[-1,1]){const h=piv(.1*s,.86,0,root,s<0?"legR":"legL");P(G.pant,M.pants,0,-.32,0,1,1,1,h);
    P(G.cyl,M.pants,0,-.64,0,.105,.06,.115,h);P(G.cyl,M.bone,0,-.69,0,.035,.08,.035,h);
    const sh=P(G.sph,M.shoe,0,-.78,.06,.11,.085,.19,h);P(G.cyl,M.dark,0,-.835,.06,.115,.015,.19,h);legs.push(h)}
  P(G.sph,M.pants,0,.88,0,.17,.1,.12);P(G.cyl,M.dark,0,.95,0,.165,.025,.115);// pelvis + belt
  // spine + ribs
  for(let i=0;i<8;i++)P(G.sph,M.bone,0,.98+i*.06,-.05,.035,.03,.035);
  for(let i=0;i<5;i++){const r=P(G.rib,M.bone,0,1.12+i*.055,.01,.12-.012*Math.abs(i-2.5),.1-.008*Math.abs(i-2.5),.1);r.rotation.set(Math.PI/2,0,Math.PI*1.32+Math.PI/2*0);r.rotation.z=-Math.PI*.17-Math.PI/2+Math.PI;}
  P(G.cap,M.bone,0,1.12,.075,.018,.12,.018);// sternum
  P(G.cap,M.bone,0,1.4,-.02,.035,.2,.035).rotation.z=Math.PI/2;// shoulder bar
  // arms reaching
  const arms=[];for(const s of[-1,1]){const a=piv(.22*s,1.4,0,root,s<0?"armR":"armL");P(G.sph,M.bone,0,0,0,.05,.05,.05,a);
    P(G.cap,M.bone,0,-.17,0,.032,.13,.032,a);const f=piv(0,-.34,0,a,"fore");P(G.sph,M.bone,0,0,0,.04,.04,.04,f);
    P(G.cap,M.bone,0,-.15,0,.028,.12,.028,f);const hd=piv(0,-.32,0,f,"hand");P(G.sph,M.skin,0,0,0,.06,.05,.035,hd);
    for(let k=0;k<4;k++)P(G.cap,M.skin,(k-1.5)*.03,-.07,.01,.017,.035,.017,hd).rotation.x=.2;P(G.cap,M.skin,.06*s*-1,-.02,.03,.017,.03,.017,hd).rotation.z=.8*s;
    f.rotation.x=-.25;a.rotation.x=-1.35;a.rotation.z=.08*s;arms.push(a)}
  // neck + head
  P(G.cyl,M.bone,0,1.5,-.02,.035,.12,.035);const head=piv(0,1.62,0,root,"head");head.rotation.z=.12;
  P(G.skull,M.skin,0,0,0,1,1,.95,head);
  P(G.sph,M.white,.055,.07,.11,.06,.06,.05,head);P(G.sph,M.dark,.06,.07,.158,.022,.022,.012,head);// bulging L eye
  P(G.sph,M.dark,-.06,.07,.12,.052,.055,.03,head);// empty socket
  P(G.sph,M.dark,-.012,.0,.135,.012,.022,.01,head);P(G.sph,M.dark,.012,0,.135,.012,.022,.01,head);// nose
  P(G.sph,M.dark,0,-.075,.085,.055,.04,.035,head);// mouth
  for(let i=0;i<4;i++)P(G.cyl,M.white,(i-1.5)*.022,-.045,.11,.008,.02,.006,head);
  const tg=P(G.cap,M.tongue,.01,-.13,.12,.028,.06,.014,head);tg.rotation.x=-.35;
  for(const hg of G.hair)P(hg,M.hair,0,0,0,1,1,1,head);
  const eye=piv(-.06,.07,.13,head,"danglyEye");P(G.cord,M.cord,0,0,0,1,1,1,eye);const eb=P(G.sph,M.veins,0,-.22,.04,.042,.042,.042,eye);
  P(G.sph,M.dark,0,-.22,.08,.013,.013,.008,eye);P(G.sph,M.cord,0,-.22,.077,.022,.022,.008,eye);
  // hitboxes
  const hb=P(G.hitBody,M.hit,0,.9,0,1,1,1,root,"hitBody");const hh=P(G.hitHead,M.hit,0,1.66,.02,1,1,1,root,"head");
  root.userData={arms,legs,head,eye,boss,hits:[hb,hh]};if(boss)root.scale.setScalar(1.6);return root}
function animZed(m,mode,t){const u=m.userData,[aR,aL]=u.arms,[lR,lL]=u.legs;
  if(mode==="walk"){const s=Math.sin(t*4.5);lR.rotation.x=s*.45;lL.rotation.x=-s*.45;aR.rotation.x=-1.35+Math.sin(t*2.2)*.15;aL.rotation.x=-1.35+Math.sin(t*2.2+1.5)*.15;
    u.head.rotation.z=.12+Math.sin(t*2.25)*.12;u.head.rotation.x=Math.sin(t*4.5)*.06;m.children.forEach(()=>{});}
  else if(mode==="dig"){lR.rotation.x=lL.rotation.x=0;aR.rotation.x=-2.7+Math.sin(t*9)*.4;aL.rotation.x=-2.7+Math.sin(t*9+2)*.4;u.head.rotation.x=-.3+Math.sin(t*5)*.1}
  else if(mode==="atk"){aR.rotation.x=-1.2+Math.sin(t*12)*.6;aL.rotation.x=-1.2-Math.sin(t*12)*.6;u.head.rotation.x=.25+Math.sin(t*12)*.1}
  u.eye.rotation.x=Math.sin(t*5.3)*.5+(mode==="dig"?.4:0);u.eye.rotation.z=Math.sin(t*3.7)*.45}

function makeZombie(boss){return buildZed(boss)}
function spawn(boss=false){const viaBreach=!boss&&S.breaches.length&&Math.random()<.45;const z={hp:boss?25+S.wave*3:(Math.random()<.2?3:2),boss,state:"",t:0,atk:0,speed:(boss?.35:.45+Math.random()*.3)+S.wave*.03};
  z.mesh=makeZombie(boss);z.max=z.hp;
  if(viaBreach){const b=S.breaches[Math.random()*S.breaches.length|0];z.breach=b;z.state="bang";z.mesh.position.set(b.pos.x*1.15,FLOOR,b.pos.z*1.15);z.mesh.visible=false;b.hp=3}
  else{const a=Math.random()*Math.PI*2,r=boss?5:2.6+Math.random()*2.5;z.state="dig";z.mesh.position.set(Math.sin(a)*r,FLOOR-1.8*(boss?1.6:1),-Math.cos(a)*r);
    const d=new THREE.Mesh(new THREE.PlaneGeometry(boss?2.4:1.4,boss?2.4:1.4),new THREE.MeshBasicMaterial({map:dirtTex,transparent:true,depthWrite:false}));d.rotation.x=-Math.PI/2;d.position.set(z.mesh.position.x,FLOOR+.01,z.mesh.position.z);d.scale.setScalar(.01);scene.add(d);z.decal=d;snd(70,.6,"sawtooth",.15,40)}
  z.mesh.lookAt(0,z.mesh.position.y,0);scene.add(z.mesh);zombies.push(z);if(boss){S.boss=z;flashMsg("☠ BOSS ☠",2500);snd(50,1.5,"sawtooth",.3,30)}}
function killZ(z,silent){scene.remove(z.mesh);if(z.decal){z.decal.userData.fade=1;if(silent)scene.remove(z.decal)}zombies.splice(zombies.indexOf(z),1);if(z===S.boss)S.boss=false;
  if(!silent){burst(z.mesh.position.clone().setY(z.mesh.position.y+1),0x5a0000,20,3);S.combo++;S.comboT=2.5;S.score+=(z.boss?1000:100)*Math.min(S.combo,10);snd(120,.3,"sawtooth",.2,40)}}

// ---------- shooting ----------
const ray=new THREE.Raycaster();let lastShot=0;
function shoot(){const now=performance.now();if(S.reloading||now-lastShot<150)return;if(S.ammo<=0){snd(200,.05,"square",.1);flashMsg("RELOAD!",800);return}
  lastShot=now;S.ammo--;noise(.12,.4);snd(140,.1,"square",.15,60);
  ray.setFromCamera({x:0,y:0},camera);const hits=ray.intersectObjects(zombies.flatMap(z=>z.mesh.userData.hits),false);
  if(hits.length){const h=hits[0];const z=zombies.find(z=>z.mesh===h.object.parent);
    if(z&&z.state!=="bang"){const head=h.object.name==="head";z.hp-=head?3:1;burst(h.point,0x880000,8,1.5);if(head)S.score+=50;z.mesh.position.addScaledVector(z.mesh.position.clone().setY(0).normalize(),.15);if(z.hp<=0)killZ(z)}}
  else{S.combo=0}
  if(S.ammo===0)setTimeout(reload,300);hud()}
function reload(){if(S.reloading||S.ammo===MAG||S.mode!=="play")return;S.reloading=true;snd(400,.08,"square",.1);hud();setTimeout(()=>{S.ammo=MAG;S.reloading=false;snd(700,.08,"square",.1);hud()},1100)}

// ---------- waves ----------
function nextWave(){S.wave++;S.toSpawn=3+S.wave*2;S.spawnT=1.5;flashMsg("WAVE "+S.wave,2000);if(S.wave%3===0)setTimeout(()=>S.mode==="play"&&spawn(true),2500);hud()}
function hurt(){S.hp--;S.combo=0;$("dmg").style.opacity=1;setTimeout(()=>$("dmg").style.opacity=0,250);snd(90,.3,"sawtooth",.3);navigator.vibrate&&navigator.vibrate(150);hud();
  if(S.hp<=0){S.mode="dead";$("overlay").style.display="flex";$("panel").querySelector("p").innerHTML="You were eaten on wave "+S.wave+".<br>Score: "+S.score;$("start").textContent="AGAIN";
    $("start").onclick=()=>{$("overlay").style.display="none";startSetup()}}}
function hud(){$("hearts").textContent="❤".repeat(Math.max(0,S.hp))+"♡".repeat(MAX_HP-Math.max(0,S.hp));$("ammo").textContent=S.reloading?"RELOADING…":"▮".repeat(S.ammo)+"▯".repeat(MAG-S.ammo);
  $("score").textContent=S.score;$("combo").textContent=S.combo>1?"x"+Math.min(S.combo,10)+" COMBO":"";$("wave").textContent=S.wave?"Wave "+S.wave:"Setup"}

// ---------- off-screen arrows ----------
const arrows=$("arrows");function updArrows(){let h="";const v=new THREE.Vector3();for(const z of zombies){if(z.state==="bang")continue;v.copy(z.mesh.position).setY(z.mesh.position.y+1).project(camera);
  const behind=v.z>1;if(!behind&&Math.abs(v.x)<1&&Math.abs(v.y)<1)continue;let x=v.x,y=v.y;if(behind){x=-x;y=-y}const a=Math.atan2(-y,x);
  const px=innerWidth/2+Math.cos(a)*innerWidth*.42,py=innerHeight/2+Math.sin(a)*innerHeight*.42;h+=`<div style="position:absolute;left:${px}px;top:${py}px;color:#f33;font-size:${z.boss?34:24}px;transform:translate(-50%,-50%) rotate(${a}rad)">➤</div>`}arrows.innerHTML=h}

// ---------- loop ----------
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;updateCam();
  if(S.mode==="play"){
    S.spawnT-=dt;if(S.toSpawn>0&&S.spawnT<=0&&zombies.length<6+S.wave){spawn();S.toSpawn--;S.spawnT=Math.max(.6,2.6-S.wave*.2)}
    if(S.toSpawn<=0&&zombies.length===0)nextWave();
    if(S.comboT>0&&(S.comboT-=dt)<=0){S.combo=0;hud()}
    for(const z of zombies.slice()){z.t+=dt;const m=z.mesh,ud=m.userData;
      if(z.state==="dig"){const target=FLOOR;m.position.y=Math.min(target,m.position.y+dt*(z.boss?.9:.8));z.decal.scale.setScalar(Math.min(1,z.t*1.5));
        if(Math.random()<.4)burst(new THREE.Vector3(m.position.x,FLOOR,m.position.z),0x4a3020,1,1.5,1.5);animZed(m,"dig",z.t);
        if(m.position.y>=target){z.state="walk"}}
      else if(z.state==="bang"){const b=z.breach;if(z.t>b.hp*0+0.8*(4-b.hp)+.8){b.hp--;z.t=0;noise(.25,.5);snd(80,.2,"square",.25);b.mesh.material.opacity=.15+(3-b.hp)*.15;
          if(!b.crack){b.crack=new THREE.Mesh(new THREE.PlaneGeometry(1,1.8),new THREE.MeshBasicMaterial({map:glassTex,transparent:true,depthWrite:false,side:2}));b.crack.position.copy(b.pos);b.crack.quaternion.copy(b.mesh.quaternion);scene.add(b.crack)}
          b.crack.scale.setScalar(.5+(3-b.hp)*.25);burst(b.pos,0x8b6b4a,6,1.5);
          if(b.hp<=0){burst(b.pos,0x8b6b4a,30,4);m.visible=true;m.position.set(b.pos.x,FLOOR,b.pos.z);z.state="walk";setTimeout(()=>{if(b.crack){scene.remove(b.crack);b.crack=null}b.mesh.material.opacity=.08},1500)}}}
      else{const d=Math.hypot(m.position.x,m.position.z);m.lookAt(0,m.position.y,0);
        if(d>.9){m.position.x-=m.position.x/d*z.speed*dt;m.position.z-=m.position.z/d*z.speed*dt;animZed(m,"walk",z.t);m.rotateZ(Math.sin(z.t*2.25)*.06)}
        else{z.atk-=dt;animZed(m,"atk",z.t);if(z.atk<=0){z.atk=z.boss?1:1.6;hurt();if(S.mode!=="play")break}}}}
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i],u=p.userData;u.life-=dt;u.v.y-=6*dt;p.position.addScaledVector(u.v,dt);if(p.position.y<FLOOR){p.position.y=FLOOR;u.v.multiplyScalar(.3)}if(u.life<=0){scene.remove(p);parts.splice(i,1)}}
  scene.children.forEach(c=>{if(c.userData.fade){c.material.opacity-=dt*.2;if(c.material.opacity<=0)scene.remove(c)}});
  if(S.mode==="play"||S.mode==="setup")updArrows();
  renderer.render(scene,camera)}
requestAnimationFrame(loop);
window.__S=S;
</script>
</body></html>
